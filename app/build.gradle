plugins {
    id 'com.android.application'
}

configurations {
    smaliAssembler
}

def payloadAssets = layout.buildDirectory.dir('generated/parityAssets')
def assemblePayload = tasks.register('assemblePayload', JavaExec) {
    classpath = configurations.smaliAssembler
    mainClass.set('org.jf.smali.Main')
    inputs.dir(rootProject.file('payload/smali'))
    outputs.file(payloadAssets.map { it.file('parity/classes.dex') })
    doFirst {
        def dex = payloadAssets.get().file('parity/classes.dex').asFile
        dex.parentFile.mkdirs()
        args = ['assemble', '--api', '35', '--output', dex.absolutePath,
                rootProject.file('payload/smali').absolutePath]
    }
}

android {
    namespace 'io.github.madokatext.baiduinputmod'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.madokatext.baiduinputmod'
        minSdk 35
        targetSdk 35
        versionCode 5
        versionName '1.1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            // A ready-to-install APK without requiring repository secrets.
            signingConfig signingConfigs.debug
        }
    }
    sourceSets.main.assets.srcDir(payloadAssets)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure { dependsOn(assemblePayload) }

dependencies {
    compileOnly project(':xposed-api')
    compileOnly 'androidx.annotation:annotation:1.9.1'
    smaliAssembler 'org.smali:smali:2.5.2'
}
