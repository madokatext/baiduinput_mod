plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.madokatext.baiduinputmod'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.madokatext.baiduinputmod'
        minSdk 35
        targetSdk 35
        versionCode 8
        versionName '1.2.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // A ready-to-install APK without requiring repository secrets.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':xposed-api')
    implementation project(':xposed-service')
    compileOnly 'androidx.annotation:annotation:1.9.1'
}
