name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 15 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore CI APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: baiduinput-mod-ci-signing-v1
      - name: Assemble installable APK
        run: gradle --no-daemon --console=plain :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baiduinput-mod-api100-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
